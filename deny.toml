[graph]
all-features = true

[advisories]
yanked = "warn"
unmaintained = "workspace"
unsound = "workspace"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2026-0098", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0099", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0104", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0118", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0119", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0258", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0346", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0349", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0382", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0487", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0489", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0490", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0491", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0504", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0505", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0511", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0512", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0514", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0530", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0531", reason = "existing advisory" },
    { id = "RUSTSEC-2026-0532", reason = "existing advisory" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true
ignore-sources = ["ssh://git@ssh.shipyard.rs/stock-trek/crate-index.git/"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[bans.workspace-dependencies]
duplicates = "allow"
unused = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "ssh://git@ssh.shipyard.rs/stock-trek/crate-index.git",
]
allow-git = []
