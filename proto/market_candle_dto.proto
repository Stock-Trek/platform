syntax = "proto3";
package dto;

import "market_ohlcv_dto.proto";

message MarketCandleDto {
  uint32 window = 1;
  uint64 start_time_millis_inc = 2;
  bool is_candle_closed = 3;
  MarketOhlcvDto ohlcv_dto = 4;
  uint64 trade_count = 5;
}

message MarketCandlesDto {
  repeated MarketCandleDto candles_dto = 1;
}
