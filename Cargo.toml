[workspace]
resolver = "2"
members = ["crates/*/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99.0"

[workspace.dependencies]
platform-auth-relay = { path = "crates/auth-plane/auth-relay" }
platform-auth-service = { path = "crates/auth-plane/auth-service" }

platform-build-agent = { path = "crates/build-plane/build-agent" }
platform-build-orchestrator = { path = "crates/build-plane/build-orchestrator" }
platform-git-webhook = { path = "crates/build-plane/git-webhook" }

platform-portfolio-registry = { path = "crates/control-plane/portfolio-registry" }
platform-run-invoker = { path = "crates/control-plane/run-invoker" }
platform-run-store = { path = "crates/control-plane/run-store" }

platform-aggregator = { path = "crates/data-plane/aggregator" }
platform-archive = { path = "crates/data-plane/archive" }
platform-archiver = { path = "crates/data-plane/archiver" }
platform-backfiller = { path = "crates/data-plane/backfiller" }
platform-compactor = { path = "crates/data-plane/compactor" }
platform-ingester = { path = "crates/data-plane/ingester" }
platform-portfolio-service = { path = "crates/data-plane/portfolio-service" }
platform-rebuilder = { path = "crates/data-plane/rebuilder" }
platform-runtime = { path = "crates/foundation/runtime" }

platform-aws = { path = "crates/foundation/aws" }
platform-config = { path = "crates/foundation/config" }
platform-errors = { path = "crates/foundation/errors" }
platform-exchange-types = { path = "crates/foundation/exchange-types" }
platform-market-data = { path = "crates/foundation/market-data" }
platform-messages = { path = "crates/foundation/messages" }
platform-metrics = { path = "crates/foundation/metrics" }
platform-nats = { path = "crates/foundation/nats" }
platform-portfolio-ownership = { path = "crates/foundation/portfolio-ownership" }
platform-proto-gen = { path = "crates/foundation/proto-gen" }
platform-sigv4 = { path = "crates/foundation/sigv4" }
platform-type-bridge = { path = "crates/foundation/type-bridge" }

platform-time = { path = "crates/foundation/time" }
platform-types = { path = "crates/foundation/types" }

platform-exchange-gateway = { path = "crates/integrations/exchange-gateway" }
platform-git = { path = "crates/integrations/git" }
platform-github = { path = "crates/integrations/github" }
platform-sqs = { path = "crates/integrations/sqs" }

platform-exit-codes = { path = "crates/sandbox-plane/exit-codes" }
platform-runner = { path = "crates/sandbox-plane/runner" }

arrow-array = "58"
arrow-schema = "58"
async-nats = "0.51"
async-trait = "0.1"
aws-config = "1"
aws-credential-types = "1"
aws_lambda_events = { version = "1", default-features = false }
aws-sdk-lambda = { version = "1", default-features = false }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-sdk-sqs = { version = "1", default-features = false }
aws-sdk-ssm = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = "1"
aws-smithy-runtime-api = "1"
base64 = "0.23"
bimap = "0.6"
bs58 = "0.5"
bytes = "1"
chrono = "0.4"
data-encoding = "2"
ed25519-compact = "2"
futures = "0.3"
futures-timer = "3"
hex = "0.4"
hmac = "0.13"
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
httpdate = "1"
iceberg = "0.11"
iceberg-catalog-rest = "0.11"
iceberg-storage-opendal = "0.11"
iris = { version = "1", registry = "shipyard" }
jsonwebtoken = { version = "10", default-features = false }
lambda_http = "1"
lambda_runtime = "1"
lru = "0.18"
metrics = "0.24"
metrics_cloudwatch_embedded = "0.10"
octocrab = "0.54"
p256 = "0.14"
p384 = "0.14"
parking_lot = "0.12"
parquet = "58"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
query-params = { version = "2", registry = "shipyard" }
rand = "0.8"
redis = { version = "0.32", default-features = false, features = [
    "connection-manager",
    "script",
    "tls-rustls-webpki-roots",
    "tokio-comp",
    "tokio-rustls-comp",
] }
reqwest = { version = "0.13", default-features = false }
rsa = "0.10"
rust_decimal = "1"
secrecy = "0.10"
serde = "1"
serde_json = "1"
serde_with = "3"
sha2 = "0.11"
signature = "2"
stock-trek = "0.19"
stock-trek-check = "0.3"
stock-trek-types = "0.6"
strum = "0.28"
subtle = "2"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = "1"
tokio-websockets = { version = "0.13", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = "1"
wasmtime = { version = "=50.0.1", default-features = false }
wasmtime-wasi = { version = "=50.0.1", default-features = false }
zip = { version = "9", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
