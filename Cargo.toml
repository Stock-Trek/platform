[workspace]
resolver = "2"
members = ["crates/*/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
platform-build-agent = { path = "crates/build-plane/build-agent" }
platform-build-orchestrator = { path = "crates/build-plane/build-orchestrator" }
platform-git-webhook = { path = "crates/build-plane/git-webhook" }

platform-aggregator = { path = "crates/data-plane/aggregator" }
platform-archive = { path = "crates/data-plane/archive" }
platform-archiver = { path = "crates/data-plane/archiver" }
platform-backfiller = { path = "crates/data-plane/backfiller" }
platform-compactor = { path = "crates/data-plane/compactor" }
platform-ingester = { path = "crates/data-plane/ingester" }
platform-rebuilder = { path = "crates/data-plane/rebuilder" }
platform-runtime = { path = "crates/foundation/runtime" }

platform-aws = { path = "crates/foundation/aws" }
platform-config = { path = "crates/foundation/config" }
platform-errors = { path = "crates/foundation/errors" }
platform-exchange-types = { path = "crates/foundation/exchange-types" }
platform-market-data = { path = "crates/foundation/market-data" }
platform-messages = { path = "crates/foundation/messages" }
platform-metrics = { path = "crates/foundation/metrics" }
platform-nats = { path = "crates/foundation/nats" }
platform-proto-gen = { path = "crates/foundation/proto-gen" }
platform-type-bridge = { path = "crates/foundation/type-bridge" }

platform-time = { path = "crates/foundation/time" }
platform-types = { path = "crates/foundation/types" }

platform-exchange-gateway = { path = "crates/integrations/exchange-gateway" }
platform-git = { path = "crates/integrations/git" }
platform-github = { path = "crates/integrations/github" }
platform-sqs = { path = "crates/integrations/sqs" }

platform-exit-codes = { path = "crates/sandbox-plane/exit-codes" }
platform-runner = { path = "crates/sandbox-plane/runner" }

arrow-array = "60"
arrow-schema = "60"
async-nats = "0.51"
async-trait = "0.1"
aws-config = "1"
aws-credential-types = "1"
aws_lambda_events = "1"
aws-sdk-lambda = "1"
aws-sdk-s3 = "1"
aws-sdk-s3-transfer-manager = "0.3"
aws-sdk-sqs = "1"
aws-sdk-ssm = "1"
aws-sigv4 = "1"
aws-smithy-runtime-api = "1"
base64 = "0.23"
bimap = "0.6"
bs58 = "0.5"
bytes = "1"
chrono = "0.4"
data-encoding = "2"
ed25519-compact = "2"
futures = "0.3"
futures-timer = "3"
hex = "0.4"
hmac = "0.13"
http = "1"
httpdate = "1"
iceberg = "0.10"
iceberg-catalog-rest = "0.10"
iceberg-storage-opendal = "0.10"
iris = { version = "1", registry = "shipyard" }
jsonwebtoken = "10"
lambda_http = "1"
lambda_runtime = "1"
lru = "0.18"
metrics = "0.24"
metrics_cloudwatch_embedded = "0.10"
octocrab = "0.54"
p256 = "0.13"
p384 = "0.13"
parking_lot = "0.12"
parquet = "60"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
query-params = { version = "2", registry = "shipyard" }
rand = "0.8"
reqwest = "0.12"
rsa = "0.9"
rust_decimal = "1"
secrecy = "0.10"
serde = "1"
serde_json = "1"
serde_with = "3"
sha2 = "0.11"
stock-trek = "0.15.3"
stock-trek-check = "0.3"
stock-trek-types = "0.5.1"
strum = "0.28"
subtle = "2"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = "1"
tokio-websockets = "0.13"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
urlencoding = "2"
uuid = "1"
zip = "9"

[profile.release]
lto = "thin"
codegen-units = 1
