platform-market-data = { workspace = true }
platform-metrics = { workspace = true }
platform-time = { workspace = true }
platform-types = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
