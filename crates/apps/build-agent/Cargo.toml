[package]
name = "platform-build-agent"
version.workspace = true
edition.workspace = true

[dependencies]
platform-config = { workspace = true }
platform-errors = { workspace = true }
platform-messages = { workspace = true }
platform-metrics = { workspace = true }
base64 = { workspace = true }
lambda_runtime = { workspace = true }
metrics = { workspace = true }
metrics_cloudwatch_embedded = { workspace = true, features = ["lambda"] }
reqwest = { workspace = true, default-features = false, features = ["multipart", "rustls-tls", "stream"] }
serde_json = { workspace = true }
stock-trek-check = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "time"] }
tracing = { workspace = true }
zip = { workspace = true, default-features = false, features = ["deflate"] }
