[package]
name = "platform-build-orchestrator"
version.workspace = true
edition.workspace = true

[dependencies]
platform-aws = { workspace = true }
platform-build-paths = { workspace = true }
platform-config = { workspace = true }
platform-errors = { workspace = true, features = ["http", "lambda", "storage"] }
platform-github = { workspace = true }
platform-git = { workspace = true }
platform-messages = { workspace = true }
platform-metrics = { workspace = true }
platform-runtime = { workspace = true }
platform-sqs = { workspace = true }
platform-time = { workspace = true }
aws-credential-types = { workspace = true }
aws_lambda_events = { workspace = true, default-features = false, features = ["sqs"] }
aws-sdk-lambda = { workspace = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { workspace = true }
aws-sdk-sqs = { workspace = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
lambda_runtime = { workspace = true }
metrics = { workspace = true }
metrics_cloudwatch_embedded = { workspace = true, features = ["lambda"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing = { workspace = true }
zip = { workspace = true, default-features = false, features = ["deflate"] }
