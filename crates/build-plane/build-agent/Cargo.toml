[package]
name = "platform-build-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "platform-build-agent"
path = "../../../bin/build-agent/main.rs"

[dependencies]
parking_lot = { workspace = true }
platform-config = { workspace = true }
platform-errors = { workspace = true, features = ["http-client", "lambda", "storage", "zip"] }
platform-messages = { workspace = true }
platform-metrics = { workspace = true }
platform-runtime = { workspace = true }
base64 = { workspace = true }
lambda_runtime = { workspace = true }
metrics_cloudwatch_embedded = { workspace = true, features = ["lambda"] }
reqwest = { workspace = true, default-features = false, features = ["multipart", "rustls", "stream"] }
serde_json = { workspace = true }
stock-trek-check = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "time"] }
tracing = { workspace = true }
zip = { workspace = true, default-features = false, features = ["deflate"] }
