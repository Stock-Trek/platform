[package]
name = "platform-front-end-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "platform-front-end-api"
path = "../../../bin/front-end-api/main.rs"

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
ed25519-compact = { workspace = true }
futures = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
platform-config = { workspace = true }
platform-errors = { workspace = true, features = ["http"] }
platform-runtime = { workspace = true }
platform-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
stock-trek-types = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-websockets = { workspace = true, features = ["server", "sha1_smol"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
