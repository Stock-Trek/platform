[package]
name = "platform-run-invoker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
aws-credential-types = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-lambda = { workspace = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { workspace = true }
chrono = { workspace = true }
platform-aws = { workspace = true }
platform-config = { workspace = true }
platform-errors = { workspace = true, features = ["lambda", "storage"] }
platform-run-store = { workspace = true }
platform-runtime = { workspace = true }
platform-time = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tracing = { workspace = true }

[dev-dependencies]
platform-runner = { workspace = true }
