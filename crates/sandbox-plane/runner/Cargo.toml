[package]
name = "platform-runner"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
platform-cwasm = { workspace = true }
platform-exit-codes = { workspace = true }
prost = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
stock-trek = { workspace = true }
traitreg = { workspace = true }

[dev-dependencies]
platform-errors = { workspace = true, features = ["http", "storage"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
