[package]
name = "platform-runner"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
platform-exit-codes = { workspace = true }
prost = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
stock-trek = { workspace = true }
traitreg = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
platform-errors = { workspace = true, features = ["http", "storage"] }
reqwest = { workspace = true, default-features = false, features = ["rustls-tls", "stream"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "time"] }
tracing = { workspace = true }
wasmtime = { workspace = true, features = ["runtime", "std"] }
wasmtime-wasi = { workspace = true, features = ["p1"] }

[dev-dependencies]
wasmtime = { workspace = true, features = ["cranelift", "wat"] }
