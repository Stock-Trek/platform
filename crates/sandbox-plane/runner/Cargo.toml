[package]
name = "platform-runner"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
platform-exit-codes = { workspace = true }
prost = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
stock-trek = { workspace = true }
traitreg = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
platform-config = { workspace = true }
platform-errors = { workspace = true, features = ["http", "storage"] }
platform-messages = { workspace = true }
platform-sigv4 = { workspace = true }
platform-types = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls", "stream"] }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-websockets = { workspace = true, features = ["client", "rustls-webpki-roots", "sha1_smol", "rand"] }
tracing = { workspace = true }
wasmtime = { workspace = true, features = ["runtime", "std"] }
wasmtime-wasi = { workspace = true, features = ["p1"] }

[dev-dependencies]
wasmtime = { workspace = true, features = ["cranelift", "wat"] }
tokio = { workspace = true, features = ["test-util"] }
