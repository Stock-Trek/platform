[package]
name = "platform-runner"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
platform-exit-codes = { workspace = true }
prost = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
stock-trek = { workspace = true }
traitreg = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aws-sdk-sqs = { workspace = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
platform-auth-service = { workspace = true }
platform-aws = { workspace = true }
platform-config = { workspace = true }
platform-errors = { workspace = true, features = ["http", "storage"] }
platform-sqs = { workspace = true }
platform-time = { workspace = true }
platform-types = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["rustls", "stream"] }
secrecy = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "time"] }
tokio-websockets = { workspace = true, features = ["client", "rustls-webpki-roots", "sha1_smol", "rand"] }
tracing = { workspace = true }
wasmtime = { workspace = true, features = ["runtime", "std"] }
wasmtime-wasi = { workspace = true, features = ["p1"] }

[dev-dependencies]
wasmtime = { workspace = true, features = ["cranelift", "wat"] }
