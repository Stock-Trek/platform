[package]
name = "platform-auth-service"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
data-encoding = { workspace = true }
ed25519-compact = { workspace = true }
hmac = { workspace = true }
http-body-util = { workspace = true }
httpdate = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
jsonwebtoken = { workspace = true, default-features = false, features = ["aws_lc_rs"] }
parking_lot = { workspace = true }
platform-config = { workspace = true }
platform-errors = { workspace = true }
platform-metrics = { workspace = true }
platform-messages = { workspace = true }
platform-runtime = { workspace = true }
platform-sigv4 = { workspace = true }
platform-sqs = { workspace = true }
platform-time = { workspace = true }
platform-types = { workspace = true }
rand = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls"] }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true, features = ["derive"] }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
platform-metrics = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
