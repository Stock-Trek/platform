name: Test

on:
  push:
    branches-ignore:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "2aecd8e8-fa70-41c3-bf79-a124b5675a46"
          project-slug: "agents"
          env-slug: "dev"

      - name: Set up shipyard ssh auth
        env:
          SHIPYARD_KNOWN_HOST: ${{ env.SHIPYARD_KNOWN_HOST }}
          SHIPYARD_SSH_PRIVATE_KEY_READONLY: ${{ env.SHIPYARD_SSH_PRIVATE_KEY_READONLY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ env.SHIPYARD_SSH_PRIVATE_KEY_READONLY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ env.SHIPYARD_KNOWN_HOST }}" >> ~/.ssh/known_hosts
          ssh -T git@ssh.shipyard.rs

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.0

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        env:
          SHIPYARD_SSH_PRIVATE_KEY_READONLY: ${{ env.SHIPYARD_SSH_PRIVATE_KEY_READONLY }}
          SHIPYARD_KNOWN_HOST: ${{ env.SHIPYARD_KNOWN_HOST }}
        with:
          ssh-key: ${{ env.SHIPYARD_SSH_PRIVATE_KEY_READONLY }}
          ssh-known-hosts: ${{ env.SHIPYARD_KNOWN_HOST }}

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

      - name: Check
        run: cargo check --workspace

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
